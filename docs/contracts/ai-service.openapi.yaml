      operationId: recommend_policies_api_v1_recommend_post
      security:
      - ServiceTokenAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '401':
          description: Invalid or missing X-Service-Token header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '413':
          description: Request JSON body exceeds configured byte size limit.
          content:
            application/json:
