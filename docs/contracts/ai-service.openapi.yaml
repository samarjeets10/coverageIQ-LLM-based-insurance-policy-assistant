openapi: 3.1.0
info:
  title: CoverageIQ AI Service
  description: 'Unified CoverageIQ Python AI Service housing Evidence-Grounded Policy Q&A (Hybrid Search,
    Cross-Encoder Reranker, Evaluator Retry Loop) and Policy Recommendation (Module M5 / 6A: PostgreSQL
    catalog filtering, 59-feature engineering, and LightGBM / Weighted ranking).'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: Report M5 recommendation health, PostgreSQL readiness, and model state.
      operationId: health_check_health_get
      responses:
        '200':
          description: Service healthy and PostgreSQL reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ai/health:
    get:
      tags:
      - Health
      summary: Ai Health Check
      description: Unified AI health endpoint combining upstream M3 telemetry and M5 DB readiness.
      operationId: ai_health_check_ai_health_get
      responses:
        '200':
          description: Unified AI service health across M3 Q&A and M5 recommendation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHealthResponse'
        '503':
          description: PostgreSQL database connection is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHealthResponse'
  /ai/ask:
    post:
      tags:
      - Policy Q&A & Verification
      summary: Query insurance policy with evidence grounding & evaluator retry loop
      description: 'Module 4 & 5 (6C Pipeline):

        - Hybrid Retrieval (Vector + BM25)

        - Cross-Encoder Reranker

        - Grounded LLM Prompting (''NO EVIDENCE = NO CLAIM'')

        - Evaluator Agent Verification (5 dimensions)

        - Closed Retry Loop (up to 2 retries)'
      operationId: ask_coverage_query_ai_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredAnswerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/recommend:
    post:
      tags:
      - recommendation
      summary: Recommend policies (Internal AI service contract alias)
      description: Internal Node-to-Python recommendation alias sharing exact authentication, filtering,
        scoring, and warning contracts with /api/v1/recommend.
      operationId: recommend_policies_ai_recommend_post
      security:
      - ServiceTokenAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
        '401':
          description: Invalid or missing X-Service-Token header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '413':
          description: Request JSON body exceeds configured byte size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '422':
          description: Validation error on user profile, nested scope, or resource limits.
        '500':
          description: Unexpected feature construction, catalog integrity, or scoring error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '501':
          description: Requested ranking_model (e.g., 'xgboost') is not yet implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
        '503':
          description: LightGBM artifacts unavailable/corrupt or PostgreSQL catalog unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetailResponse'
  /api/v1/recommend:
    post:
      tags:
      - recommendation
      summary: Recommend policies (Final Design Report endpoint)
      description: Evaluates candidate policies from PostgreSQL using deterministic Stage 4 hard eligibility
        filters, computes the 59-column Stage 5 feature matrix on eligible candidates only, and ranks
        Top-N policies via LightGBM ('auto'/'lightgbm') or transparent weighted scoring ('weighted').
