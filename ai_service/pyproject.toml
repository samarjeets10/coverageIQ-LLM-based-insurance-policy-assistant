[project]
name = "coverageiq-ai-service"
version = "0.1.0"
description = "CoverageIQ Python FastAPI AI Service (Stage 2 DB Foundation & Recommendation Scaffold)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
include = [
    "main.py",
    "common/**/*.py",
    "recommendation/**/*.py",
    "tests/conftest.py",
    "tests/test_database_integration.py",
    "tests/test_dataset.py",
    "tests/test_features.py",
    "tests/test_filters.py",
    "tests/test_health_and_config.py",
    "tests/test_inference.py",
    "tests/test_m5_final_integration.py",
    "tests/test_m5_missingness_and_sensitivity.py",
    "tests/test_m5_stage_i2_hardening.py",
    "tests/test_phase9b1_hardening.py",
    "tests/test_schema_draft.py",
    "tests/test_schemas.py",
    "tests/test_stage8b_versioning_and_schema.py",
    "tests/test_stage9a_robustness.py",
    "tests/test_stage10a_m5_completion.py",
    "tests/test_train_lightgbm.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ai_service"]
